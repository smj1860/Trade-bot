name: Paper trade

# Forward paper trading: every hour, scores the latest closed hourly candle of
# each symbol with every model registered in the paper_models table, opens
# simulated trades, and resolves open ones from later candles. Public Kraken
# market data only -- no API keys, no orders. See
# python-strategy/scripts/paper_trade.py. Needs the SUPABASE_DB_URL secret.
#
# GitHub's scheduler can delay or skip runs; a skipped hour only leaves a gap
# in new signals (exits are always resolved from candle data).

on:
  schedule:
    - cron: "7 * * * *" # 7 past: the previous hour's candle has closed
  workflow_dispatch:
    inputs:
      arm:
        description: 'Arm name or "all"'
        required: false
        default: "all"
      dry_run:
        description: "Score and print only; write nothing"
        required: false
        default: "false"
      borrow_per_hour:
        description: "Fraction of notional per hour charged to short trades in the report only"
        required: false
        default: "0.0"

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-strategy/requirements-training.txt

      - name: Install dependencies
        run: pip install psycopg2-binary requests scikit-learn joblib

      - name: Run paper trader
        working-directory: python-strategy
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DRY=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python scripts/paper_trade.py --arm "${{ github.event.inputs.arm || 'all' }}" $DRY

      - name: Report
        working-directory: python-strategy
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scripts/paper_report.py --arm "${{ github.event.inputs.arm || 'all' }}" --borrow-per-hour "${{ github.event.inputs.borrow_per_hour || '0.0' }}"
