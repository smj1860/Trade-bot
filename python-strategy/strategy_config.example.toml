# -----------------------------------------------------------------------------
# Example strategy-layer configuration — copy to strategy_config.toml and edit.
# This is separate from config/config.example.toml (which configures the Rust
# core): this file only controls Process B's behavior.
# -----------------------------------------------------------------------------

[connection]
rust_core_addr = "localhost:50051"
# Dead-man's switch heartbeat interval (see strategy/engine.py's
# _heartbeat_loop and rust-core/src/heartbeat.rs). Keep this comfortably
# under the Rust side's dead_man_switch.heartbeat_timeout_secs
# (config.example.toml, default 30s) — the default here gives six
# heartbeats per timeout window.
heartbeat_interval_secs = 5.0

[strategy]
name = "imbalance_momentum"
# Which normalized symbols this strategy instance trades. Must be a subset of
# what the Rust core is configured to track.
symbols = ["BTC-USD", "ETH-USD"]
exchange = "kraken"

# Signal must exceed this magnitude (signal is in [-1, 1]) before the policy
# turns it into an order at all. Below this, the strategy is treated as
# having no opinion.
signal_threshold = 0.35

# Minimum time between two orders on the same symbol, regardless of signal —
# a basic guard against a noisy signal firing repeatedly on the same move.
cooldown_seconds = 30

# Base order size per symbol, in base-asset units — the reference size
# [strategy.sizing] below scales relative to. Must be below the Rust risk
# engine's per-symbol max_order_size in config/config.example.toml, or
# every order gets rejected there (including a scaled-up one — sizing.
# max_size_multiplier should be chosen with that ceiling in mind).
[strategy.order_quantity]
BTC-USD = "0.001"
ETH-USD = "0.01"

# Institutional audit Phase 2.1: volatility/conviction-scaled position
# sizing (see strategy/policy.py's scaled_quantity()). Scales
# [strategy.order_quantity] above by inverse recent volatility (so a
# calmer-than-usual market gets a bigger clip for the same implied
# dollar-risk budget, a choppier one a smaller clip) and by how strong the
# signal is (a signal that just barely cleared signal_threshold gets less
# size than one at maximum conviction). Falls back to the flat
# order_quantity unchanged whenever a symbol doesn't have enough bar
# history yet for a real realized_vol reading, or when disabled here.
[strategy.sizing]
enabled = true
# Per-bar realized_vol level (a log-return stdev, NOT annualized — see
# strategy/indicators.py's realized_vol) this scales toward. Tune this
# per bar_interval_minutes and the symbols actually traded; there is no
# universal right value, and the default here is a starting point, not a
# calibrated one.
target_volatility = 0.02
# The inverse-volatility scalar (and the combined volatility x conviction
# scalar) is clamped to this multiplicative band around order_quantity —
# both a sanity bound and a reminder that these are multipliers of an
# already-sized base quantity, not standalone sizing.
min_size_multiplier = 0.25
max_size_multiplier = 2.0
# Conviction scaling: a signal right at signal_threshold gets this
# multiplier; a signal at the maximum possible magnitude (1.0) gets 1.0x
# (before the volatility scalar above is layered on). Linear in between.
# Set to 1.0 to disable conviction scaling while keeping volatility
# scaling.
min_conviction_multiplier = 0.5

# Feature engine parameters (see strategy/features.py).
[strategy.features]
# Number of order book updates kept in the rolling window used to compute
# momentum (mid-price now vs. mid-price `momentum_window` updates ago).
momentum_window = 20

# Bar-derived features (see strategy/bars.py + strategy/indicators.py):
# sma_ratio, ema_ratio, rsi, realized_vol, bar_momentum,
# bollinger_percent_b, bollinger_bandwidth, awesome_oscillator,
# macd_histogram, cci, williams_percent_r. These are computed over
# fixed-duration bars built from mid-price ticks, not raw ticks, which is
# what lets them be trained on Kraken's historical OHLC candles (unlike
# imbalance/momentum above, which need live order-book depth that
# historical data doesn't have — see docs/model-training.md).
#
# bar_interval_minutes MUST match whatever interval_minutes the training
# data was pulled at (historical-data/backfill_ohlc.py's default is 60),
# or a trained model will be scored against bars of a different length
# than it was trained on. Window sizes below are sized to what's actually
# available in ~1 month of hourly history as of this writing — except
# ao_slow_window and macd_slow_window, which are their classic defaults
# (34 and 26) and will need more history to produce a non-neutral value.
bar_interval_minutes = 60
sma_window = 20
ema_window = 12
rsi_window = 14
vol_window = 20
bar_momentum_window = 10
bollinger_window = 20
bollinger_num_std = 2.0
ao_fast_window = 5
ao_slow_window = 34
macd_fast_window = 12
macd_slow_window = 26
macd_signal_window = 9
cci_window = 20
williams_r_window = 14

# Relative weight given to order-book imbalance vs. momentum when the
# rule-based model combines them into a single signal. Must sum to 1.0.
[strategy.model]
kind = "rule_based"  # "rule_based" | "sklearn" | "torch"
imbalance_weight = 0.6
momentum_weight = 0.4
# Only used when kind = "sklearn" or "torch":
# model_path = "models/my_model.joblib"
# feature_order = ["mid_price", "spread", "imbalance", "momentum", "sma_ratio", "ema_ratio", "rsi", "realized_vol", "bar_momentum", "bollinger_percent_b", "bollinger_bandwidth", "awesome_oscillator", "macd_histogram", "cci", "williams_percent_r"]

# Soft, client-side position limits. These are advisory — the Rust risk
# engine's config/config.example.toml limits are the real, enforced ones.
# This just stops the strategy from repeatedly trying to add to a position
# it should already consider "big enough," to cut down on noisy rejected
# orders rather than to guarantee safety.
[portfolio]
[portfolio.max_position]
BTC-USD = "0.01"
ETH-USD = "0.1"

[logging]
log_path = "logs/strategy.jsonl"
level = "INFO"

[execution]
# Belt-and-suspenders on top of the Rust core's own dry_run flag: when true,
# the strategy computes and logs what it WOULD submit but never calls
# SubmitOrder at all. Nothing reaches the network. Flip to false only once
# you've reviewed a paper-mode log and are comfortable with what it does —
# and even then, the Rust core's own execution.dry_run still gates whether
# Kraken actually places anything.
dry_run_only = true

# Institutional audit Phase 1.3: maker/limit order execution (see
# strategy/policy.py and strategy/engine.py's _manage_resting_order). A
# market order's ~0.8% one-way taker fee against a signal that hasn't
# cleared coin-flip accuracy is a guaranteed loser regardless of model
# quality — this is what makes the strategy layer worth trusting with real
# money at all, independent of which model ends up live.
#
# When true, DecisionPolicy builds post-only LIMIT orders priced at the
# current best bid (BUY) / best ask (SELL) instead of MARKET orders.
use_limit_orders = true
# How long to let a resting limit order sit before canceling and
# repricing (or giving up). Keep this well under the Rust side's
# dead_man_switch.heartbeat_timeout_secs (config/config.example.toml,
# default 30s) — this strategy's heartbeat loop (see
# connection.heartbeat_interval_secs above) keeps running independently
# while an order rests, but a very long timeout here is still an easy way
# to lose track of how stale a resting order's price has gotten.
limit_order_timeout_secs = 5.0
# How many times to cancel-and-reprice at the (possibly moved) best
# bid/ask before giving up on the maker path for this order. 0 = place
# once, cancel on timeout, never reprice.
limit_reprice_attempts = 2
# If still unfilled after exhausting limit_reprice_attempts, submit a
# MARKET order for whatever quantity never filled (paying the taker fee
# on just the leftover, rather than never completing the intended trade
# at all). false abandons the remaining quantity instead.
fallback_to_market = true
