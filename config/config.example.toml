# -----------------------------------------------------------------------------
# Example configuration — copy to config.toml and edit.
# Every trading symbol is config-driven: adding a new asset means adding a
# block here, never touching code.
# -----------------------------------------------------------------------------

[general]
# Normalized symbol format used everywhere internally: BASE-QUOTE
log_level = "info"

# Outbound alerting (rust-core/src/alerting.rs) is entirely optional and
# has no config section of its own — it's controlled by one environment
# variable, never a config file, the same credential-like pattern as
# KRAKEN_API_KEY/KRAKEN_API_SECRET (whoever holds the URL can post into
# your channel):
#   ALERT_WEBHOOK_URL — a Slack/Mattermost-style incoming webhook URL.
#     Unset = alerting silently no-ops; the tracing::error! log lines it
#     supplements still fire either way. Currently used for one thing:
#     a startup reconciliation pass that finds a fill Kraken confirms but
#     this process never recorded locally (reconcile.rs's
#     possible_missed_fills).

[[exchanges]]
name = "kraken"
ws_url = "wss://ws.kraken.com/v2"
rest_url = "https://api.kraken.com"
# API keys pulled from environment variables, never stored here:
#   KRAKEN_API_KEY / KRAKEN_API_SECRET
enabled = true

# -----------------------------------------------------------------------------
# Symbols to trade. Each entry is fully self-contained: which exchange(s) it
# trades on, its precision (tick/lot size), and its own risk limits. Adding a
# new coin/pair is adding one [[symbols]] block.
#
# NOTE on Kraken specifically: its WebSocket API v2 uses slash-delimited pairs
# with the modern asset code, e.g. "BTC/USD" (not the legacy REST v0 codes
# like "XXBTZUSD" or "XBT/USD"). Every exchange_native_symbol, rest_native_symbol,
# tick_size and lot_size below (all 13 symbols) was verified live on 2026-09-26:
# WS v2 naming by actually opening a public `book` subscription for each pair
# and confirming Kraken accepted it and streamed real order-book data (no
# credentials needed for that — see docs/training-universe.md for the full
# verification record); REST altname/tick/lot from a live
# /0/public/AssetPairs query. Re-verify before trading live again if this file
# has aged, since Kraken can change these.
#
# All 13 are quoted in USD (not USDT) — a deliberate decision, not a
# placeholder: 6 of the 13 (NEAR, SUI, UNI, AAVE, PENDLE, TAO) have no Kraken
# USDT pair at all, only USD, so USD is the only quote currency that covers
# every symbol in this set without a per-symbol exception. See
# docs/training-universe.md for the full comparison.
#
# Every symbol below is enabled for market-data ingestion and the risk
# engine. This is still safe by default: [execution].dry_run = true (below)
# means no real order can be placed on ANY of these regardless of this flag
# — validate=true only, until dry_run is explicitly turned off per the
# warning in that section.
# -----------------------------------------------------------------------------

# --- Macro Anchor Baseline ---------------------------------------------------

[[symbols]]
symbol = "BTC-USD"          # normalized internal representation
exchange = "kraken"
exchange_native_symbol = "BTC/USD"  # Kraken WS v2 pair format — verified live
rest_native_symbol = "XBTUSD"       # Kraken REST AddOrder altname — verified live
tick_size = "0.1"           # verified live via AssetPairs
lot_size = "0.00000001"     # verified live via AssetPairs
enabled = true

  [symbols.risk]
  max_position_usd = "5000"     # max net exposure in this symbol
  max_order_size = "0.05"       # max single order size, in base units
  max_order_notional_usd = "2000"

