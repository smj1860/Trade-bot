# -----------------------------------------------------------------------------
# Global risk guardrails — enforced in Rust regardless of what any strategy
# or model requests. These are the last line of defense before an order
# reaches the exchange.
#
# max_total_position_usd was raised from 10000 to 20000 when this config
# expanded from 2 to 13 symbols — with 11 more max_position_usd budgets of
# 1500-2000 each added above, the old 10000 cap would have made it
# impossible for more than a handful of symbols to hold a position
# simultaneously even well within their own per-symbol limits. This is
# still a real, enforced portfolio-wide cap (see risk.rs's
# combined_exposure_excluding), not merely descriptive — with all 13 near
# their individual max_position_usd at once, combined exposure would be
# ~$24,500, still above 20000, so the global cap remains a meaningful
# constraint that forces trade-offs across symbols rather than a number
# large enough to never bind.
# -----------------------------------------------------------------------------

[risk.global]
max_total_position_usd = "20000"      # across all symbols combined
max_orders_per_minute = 20
kill_switch_max_daily_loss_usd = "500" # halts all trading if breached

# --- Dynamic slippage/spread guardrails and the volatility circuit breaker --
# All added 2026-09-27 to catch failure modes the plain size/notional/
# position caps above don't address at all: a thin book that makes an
# order's *actual* fill price much worse than top-of-book, a spread that
# has blown out past its own recent normal, or a sudden volatility spike
# consistent with a flash crash. See rust-core/src/guardrails.rs and
# risk.rs's evaluate() for the full mechanics. Every field below has a
# built-in default (shown here) even if omitted from this file entirely,
# so an older config.toml that predates these fields keeps working.
max_slippage_pct = "0.005"            # reject if simulated fill vs. mid exceeds this
spread_multiplier = "3.0"             # reject if current spread > this x its own rolling average
min_spread_samples = 30               # the spread guard doesn't apply below this many history samples
vol_circuit_breaker_stddev = "4.0"    # trip if 1-min vol is this many stddevs above its own baseline
vol_short_window_secs = 60            # the "1-minute" window judged against the baseline
vol_baseline_bucket_secs = 60         # bucket width used to build that baseline distribution
vol_circuit_breaker_freeze_secs = 300 # how long a trip freezes the symbol to reduce-only/flat

# -----------------------------------------------------------------------------
# Execution safety switch. dry_run = true sends every order to Kraken's
# AddOrder endpoint with validate=true — Kraken checks and rejects/accepts
# the request but NEVER places it on the order book. This defaults to true
# even if this whole [execution] section is deleted from a config file, so
# a config that says nothing about execution can never be misread as
# permission to trade real money. Flip to false only once rest_native_symbol
# values above have been verified against Kraken's own AssetPairs endpoint
# and you have tested against a funded account you are prepared to risk.
# -----------------------------------------------------------------------------
[execution]
dry_run = true

# Approximate token-bucket model of Kraken's private-REST call counter
# (see rust-core/src/kraken_rest.rs::RateLimiter) — throttles this
# process's own AddOrder/OpenOrders/etc. calls before Kraken itself would
# start returning rate-limit errors, so an active position doesn't get an
# order silently dropped by an unhandled 429. Defaults (shown here)
# approximate Kraken's most conservative documented tier ("Starter") since
# this project has never verified which tier a real account sits in —
# re-tune against Kraken's current docs before trading live if the
# account is on a higher tier.
[execution.rate_limit]
max_counter = 15.0        # the counter's cap before calls start throttling
decay_per_sec = 0.3333333 # ~1 count recovered every 3 seconds
cost_per_call = 1.0       # flat cost per private REST call (a simplification — see RateLimiter's docs)
max_wait_secs = 5.0       # a call needing to wait longer than this fails fast instead of blocking

# -----------------------------------------------------------------------------
# Where positions, the kill switch's daily realized-PnL counter, and
# order/fill history are persisted (SQLite) so they survive a restart.
# Defaults to ./data/trading-core.sqlite3 (relative to wherever the process
# is run from) even if this whole [persistence] section is deleted — unlike
# [execution], there's no "safe direction" to default toward here, the
# default just needs to always be present. Parent directories are created
# automatically if they don't exist. This file is never committed (see
# .gitignore) — it can contain real order/fill history.
# -----------------------------------------------------------------------------
[persistence]
database_path = "./data/trading-core.sqlite3"

# -----------------------------------------------------------------------------
# Dead-man's switch (institutional audit Phase 1.1, added 2026-09-28). A live
# strategy process is expected to call OrderService.SendHeartbeat on an
# interval well under heartbeat_timeout_secs. If this process stops seeing
# heartbeats for a given strategy_id past that timeout, it treats the
# strategy as dead and reacts — see rust-core/src/heartbeat.rs for the full
# mechanics. Every field below has the built-in default shown here even if
# this whole section is omitted, so an older config.toml keeps working.
# -----------------------------------------------------------------------------
[dead_man_switch]
enabled = true
heartbeat_timeout_secs = 30    # no heartbeat within this window = strategy declared dead
check_interval_secs = 5        # how often the watchdog checks for staleness
auto_cancel_orders = true      # cancel the dead strategy's resting orders
                                # (today's market-order-only flow means there's
                                # rarely anything resting to cancel yet — this
                                # becomes load-bearing once maker/limit orders
                                # land; see docs/institutional-audit-implementation-plan.md
                                # in the project docs, Phase 1.3)
auto_flatten_positions = false # submit a market order to zero out every open
                                # position for the dead strategy. Off by default:
                                # this is the stronger action, and today's flat
                                # (non-vol-scaled) order sizing means a flatten
                                # order could itself be a large, un-sized-for-the-
                                # moment trade. Turn on deliberately.
